  <path d="M242 205l43-43 10 10-43 43z" fill="#d8eef2" stroke="#273d5e" stroke-width="5"/><path d="M278 159l17 17" stroke="#f0b24a" stroke-width="7"/>

  <!-- slime -->
  <g stroke="#7b4566" stroke-width="6" fill="#ee8da3">
    <path d="M1046 233v-22h10v-16h12v-16h14v12h14v12h12v30z"/>
