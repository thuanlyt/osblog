    <g fill="#4f9b4f" stroke="#2d6d3d" stroke-width="5"><rect x="32" y="124" width="74" height="24"/><rect x="20" y="106" width="48" height="23"/><rect x="76" y="102" width="50" height="24"/><rect x="48" y="91" width="54" height="24"/></g>
    <rect x="1098" y="159" width="16" height="80" fill="#7f5134" stroke="#4e362b" stroke-width="5"/>
