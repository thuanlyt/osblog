  <rect y="236" width="1400" height="9" fill="#83c85d"/>
  <rect y="264" width="1400" height="18" fill="#2d6d3d"/>
  <rect y="282" width="1400" height="48" fill="#8e633f"/>
  <g fill="#a87947"><rect x="0" y="282" width="60" height="20"/><rect x="120" y="282" width="80" height="20"/><rect x="260" y="282" width="90" height="20"/><rect x="430" y="282" width="100" height="20"/><rect x="600" y="282" width="75" height="20"/><rect x="760" y="282" width="95" height="20"/><rect x="940" y="282" width="80" height="20"/><rect x="1090" y="282" width="88" height="20"/><rect x="1250" y="282" width="95" height="20"/></g>
  <g fill="#68482f"><rect x="58" y="304" width="70" height="14"/><rect x="205" y="302" width="55" height="16"/><rect x="350" y="304" width="80" height="14"/><rect x="535" y="302" width="65" height="16"/><rect x="682" y="304" width="78" height="14"/><rect x="860" y="302" width="80" height="16"/><rect x="1020" y="304" width="70" height="14"/><rect x="1180" y="302" width="70" height="16"/><rect x="1340" y="304" width="60" height="14"/></g>

