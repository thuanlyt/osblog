<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 330" role="img" aria-labelledby="title desc" shape-rendering="crispEdges">
  <title id="title">OSBLOG pixel world</title>
  <desc id="desc">Original pixel-art landscape with clouds, trees, a castle, a character, a treasure chest and a friendly slime.</desc>
  <rect width="1400" height="330" fill="#76c9e8"/>
  <rect y="220" width="1400" height="110" fill="#a9e4f1"/>

  <!-- clouds -->
  <g fill="#fff6d8">
    <rect x="46" y="38" width="72" height="18"/><rect x="62" y="22" width="40" height="18"/><rect x="88" y="30" width="48" height="18"/><rect x="40" y="56" width="116" height="14"/>
    <rect x="1190" y="58" width="78" height="18"/><rect x="1212" y="40" width="38" height="20"/><rect x="1240" y="50" width="54" height="18"/><rect x="1180" y="76" width="126" height="13"/>
  </g>
  <g fill="#d8f2f1"><rect x="48" y="70" width="105" height="9"/><rect x="1188" y="88" width="112" height="8"/></g>

