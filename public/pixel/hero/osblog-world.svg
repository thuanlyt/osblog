    <rect x="1070" y="174" width="88" height="58"/><rect x="1128" y="150" width="78" height="82"/><rect x="1188" y="168" width="74" height="64"/>
  </g>
  <g fill="#77b9bf"><rect x="4" y="196" width="190" height="36"/><rect x="1020" y="194" width="250" height="38"/></g>

