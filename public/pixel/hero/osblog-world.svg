    <rect x="1163" y="151" width="38" height="84"/>
    <rect x="1270" y="151" width="39" height="84"/>
  </g>
  <g fill="#667fae"><rect x="1192" y="130" width="19" height="105"/><rect x="1250" y="130" width="22" height="105"/></g>
  <g fill="#385278"><rect x="1221" y="178" width="26" height="57"/><rect x="1172" y="178" width="18" height="28"/><rect x="1281" y="178" width="18" height="28"/></g>
  <g fill="#728bb8" stroke="#385278" stroke-width="6"><path d="M1178 116h28l12-26 12 26h25l12-34 13 34h29v18h-131z"/><rect x="1219" y="68" width="12" height="46"/></g>
  <path d="M1231 69h42v24h-42z" fill="#e56d69" stroke="#385278" stroke-width="5"/><path d="M1273 93l24-12-24-12z" fill="#e56d69"/>

