<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 390 520" role="img" aria-labelledby="title desc" shape-rendering="crispEdges">
  <title id="title">OSBLOG mobile 16-bit pixel world</title>
  <desc id="desc">Original portrait pixel-art landscape for the OSBLOG mobile hero with block clouds, trees, castle, adventurer, chest, flowers and slime.</desc>
  <defs>
    <pattern id="sky" width="24" height="24" patternUnits="userSpaceOnUse">
      <rect width="24" height="24" fill="#78cbea"/>
      <rect x="4" y="6" width="4" height="4" fill="#a9e3ef"/>
      <rect x="18" y="18" width="4" height="4" fill="#5eb6d8"/>
    </pattern>
    <pattern id="grass" width="24" height="16" patternUnits="userSpaceOnUse">
      <rect width="24" height="16" fill="#54a64d"/>
      <rect width="12" height="8" fill="#82cb5f"/>
      <rect x="12" y="8" width="12" height="8" fill="#418e45"/>
    </pattern>
    <pattern id="soil" width="48" height="32" patternUnits="userSpaceOnUse">
      <rect width="48" height="32" fill="#93643e"/>
      <rect width="16" height="12" fill="#ad7a49"/>
      <rect x="24" y="12" width="20" height="12" fill="#70492f"/>
      <rect x="6" y="24" width="22" height="8" fill="#805237"/>
    </pattern>
  </defs>

  <rect width="390" height="520" fill="url(#sky)"/>

  <!-- block clouds -->
  <g fill="#fff4d2">
    <rect x="18" y="42" width="84" height="18"/><rect x="34" y="26" width="42" height="18"/><rect x="68" y="34" width="50" height="18"/><rect x="10" y="60" width="116" height="14"/>
    <rect x="280" y="66" width="76" height="18"/><rect x="298" y="50" width="40" height="18"/><rect x="270" y="84" width="104" height="14"/>
  </g>
  <g fill="#d7efed"><rect x="18" y="76" width="100" height="6"/><rect x="278" y="100" width="88" height="6"/></g>

  <!-- distant chunky hills -->
  <g fill="#5c9faf"><rect x="0" y="250" width="62" height="104"/><rect x="32" y="218" width="62" height="136"/><rect x="72" y="240" width="58" height="114"/><rect x="300" y="234" width="90" height="120"/></g>
  <g fill="#74b7bd"><rect x="0" y="314" width="138" height="40"/><rect x="272" y="308" width="118" height="46"/></g>

  <!-- left tree -->
  <g stroke="#294f3b" stroke-width="4">
    <rect x="34" y="272" width="20" height="118" fill="#815238"/>
    <rect x="40" y="278" width="7" height="108" fill="#b17849" stroke="none"/>
    <path d="M44 266H8v-18h20v-16h24v14h34v18H56v22H34v-20H14z" fill="#3f8845"/>
    <path d="M44 248H18v-14h22v-14h18v18h30v14H58v18H40v-18H18z" fill="#63b150" stroke="none"/>
  </g>

  <!-- castle on right -->
  <g stroke="#2c4a70" stroke-width="5">
    <rect x="290" y="232" width="72" height="146" fill="#879bc8"/>
    <rect x="270" y="274" width="34" height="104" fill="#9aadd4"/>
    <rect x="350" y="270" width="32" height="108" fill="#748bbd"/>
    <path d="M278 274l8-28 9 28zm80-4 8-30 10 30z" fill="#647cad"/>
    <path d="M298 232h56l-8-22h-14l-8-22-8 22h-12z" fill="#7188b6"/>
    <rect x="316" y="310" width="22" height="68" fill="#31496d"/>
    <rect x="322" y="174" width="8" height="42" fill="#31496d"/>
    <path d="M330 176h36v22h-36z" fill="#d96368"/><path d="M366 198l18-11-18-11z" fill="#ed7a78" stroke="none"/>
  </g>
  <g fill="#b8c6e2"><rect x="300" y="246" width="10" height="88"/><rect x="344" y="246" width="8" height="88"/></g>

  <!-- flowers -->
  <g>
    <rect x="116" y="358" width="5" height="38" fill="#2f7040"/><rect x="104" y="348" width="12" height="12" fill="#e98ea0"/><rect x="116" y="338" width="12" height="12" fill="#ffd86e"/><rect x="128" y="348" width="12" height="12" fill="#e98ea0"/>
    <rect x="250" y="360" width="5" height="36" fill="#2f7040"/><rect x="238" y="350" width="12" height="12" fill="#ffd86e"/><rect x="250" y="340" width="12" height="12" fill="#e98ea0"/><rect x="262" y="350" width="12" height="12" fill="#ffd86e"/>
  </g>

  <!-- treasure chest -->
  <g stroke="#4d3425" stroke-width="5">
    <rect x="18" y="372" width="70" height="48" fill="#af6936"/><rect x="18" y="352" width="70" height="28" fill="#dc9340"/><rect x="29" y="358" width="48" height="8" fill="#f1b354" stroke="none"/><rect x="43" y="382" width="20" height="22" fill="#ffd15e"/>
  </g>

  <!-- adventurer -->
  <g stroke="#233c5d" stroke-width="4">
    <rect x="102" y="350" width="44" height="58" fill="#3d73b2"/>
    <rect x="108" y="320" width="34" height="34" fill="#efb06b"/>
    <rect x="101" y="312" width="48" height="14" fill="#2f609f"/>
    <rect x="111" y="304" width="34" height="10" fill="#4a7fc1"/>
    <rect x="109" y="406" width="16" height="16" fill="#34547f"/><rect x="133" y="406" width="16" height="16" fill="#34547f"/>
    <rect x="94" y="356" width="12" height="36" fill="#efb06b"/><rect x="146" y="356" width="12" height="36" fill="#efb06b"/>
  </g>
  <g fill="#243c5d"><rect x="115" y="332" width="5" height="6"/><rect x="132" y="332" width="5" height="6"/><rect x="122" y="344" width="10" height="4"/></g>
  <path d="M154 366l46-46 10 10-46 46z" fill="#d8edf2" stroke="#233c5d" stroke-width="4"/><rect x="197" y="318" width="20" height="7" fill="#f0b14d" transform="rotate(45 207 321)"/>

  <!-- slime -->
  <g stroke="#75405f" stroke-width="5"><path d="M238 418v-20h8v-16h10v-12h12v8h14v10h12v30z" fill="#ea8da3"/></g>
  <g fill="#4c2d49"><rect x="255" y="397" width="6" height="7"/><rect x="276" y="397" width="6" height="7"/></g><rect x="264" y="410" width="10" height="4" fill="#fff2d1"/><g fill="#f5b3c1"><rect x="250" y="384" width="12" height="7"/><rect x="264" y="377" width="10" height="7"/></g>

  <!-- ground tiles -->
  <rect y="394" width="390" height="32" fill="url(#grass)"/>
  <rect y="394" width="390" height="8" fill="#8bd164"/>
  <rect y="426" width="390" height="20" fill="#286d3c"/>
  <rect y="446" width="390" height="74" fill="url(#soil)"/>
  <g fill="#2e763e"><rect x="8" y="384" width="5" height="16"/><rect x="16" y="378" width="5" height="22"/><rect x="188" y="384" width="5" height="16"/><rect x="196" y="378" width="5" height="22"/><rect x="360" y="382" width="5" height="18"/></g>

  <!-- spark pixels -->
  <g fill="#ffd76e"><rect x="146" y="92" width="6" height="22"/><rect x="138" y="100" width="22" height="6"/><rect x="242" y="126" width="6" height="22"/><rect x="234" y="134" width="22" height="6"/></g>
  <g fill="#e98e9e"><rect x="190" y="58" width="6" height="18"/><rect x="184" y="64" width="18" height="6"/></g>
</svg>