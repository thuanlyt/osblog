<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 32" shape-rendering="crispEdges" role="img" aria-labelledby="title desc">
  <title id="title">OSBLOG feed control sprites</title>
  <desc id="desc">Two original 16-bit HUD sprites for RSS and Atom feed controls.</desc>

  <!-- RSS cartridge / broadcast crystal -->
  <g transform="translate(0 0)">
    <rect x="3" y="5" width="26" height="22" fill="#15384c"/>
    <rect x="1" y="9" width="2" height="14" fill="#15384c"/>
    <rect x="29" y="9" width="2" height="14" fill="#15384c"/>
    <rect x="5" y="7" width="22" height="18" fill="#f4b04f"/>
    <rect x="7" y="9" width="18" height="14" fill="#ffe39a"/>
    <rect x="7" y="9" width="18" height="3" fill="#fff3c8"/>
    <rect x="7" y="20" width="18" height="3" fill="#d78937"/>
    <rect x="8" y="18" width="4" height="4" fill="#2b5f7e"/>
    <rect x="13" y="14" width="3" height="3" fill="#2b5f7e"/>
    <rect x="16" y="17" width="3" height="3" fill="#2b5f7e"/>
    <rect x="17" y="11" width="3" height="3" fill="#2b5f7e"/>
    <rect x="20" y="14" width="3" height="3" fill="#2b5f7e"/>
    <rect x="22" y="17" width="3" height="3" fill="#2b5f7e"/>
    <rect x="4" y="26" width="6" height="2" fill="#0d2d40"/>
    <rect x="22" y="26" width="6" height="2" fill="#0d2d40"/>
  </g>

  <!-- Atom cartridge / orbital crystal -->
  <g transform="translate(32 0)">
    <rect x="3" y="5" width="26" height="22" fill="#15384c"/>
    <rect x="1" y="9" width="2" height="14" fill="#15384c"/>
    <rect x="29" y="9" width="2" height="14" fill="#15384c"/>
    <rect x="5" y="7" width="22" height="18" fill="#6579c7"/>
    <rect x="7" y="9" width="18" height="14" fill="#a8b5ef"/>
    <rect x="7" y="9" width="18" height="3" fill="#dce4ff"/>
    <rect x="7" y="20" width="18" height="3" fill="#485ca7"/>
    <rect x="14" y="14" width="4" height="4" fill="#fff0a8"/>
    <rect x="9" y="15" width="4" height="2" fill="#2f567c"/>
    <rect x="19" y="15" width="4" height="2" fill="#2f567c"/>
    <rect x="12" y="11" width="2" height="3" fill="#2f567c"/>
    <rect x="18" y="18" width="2" height="3" fill="#2f567c"/>
    <rect x="18" y="11" width="2" height="3" fill="#2f567c"/>
    <rect x="12" y="18" width="2" height="3" fill="#2f567c"/>
    <rect x="4" y="26" width="6" height="2" fill="#0d2d40"/>
    <rect x="22" y="26" width="6" height="2" fill="#0d2d40"/>
  </g>
</svg>
